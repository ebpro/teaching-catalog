name: Teaching catalog
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: catalog-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate catalog
        env:
          GITHUB_TOKEN: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}
        run: python catalog.py
      # Purged Tailwind v3 CSS (no runtime CDN): scans catalog.py for class
      # literals per tailwind.config.js, emits public/app.css (~15 s npx).
      - name: Build purged CSS
        run: npx tailwindcss@3.4.19 -c tailwind.config.js -i inputs.css -o public/app.css --minify
      - name: Upload catalog site artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-site
          # Two top-level dirs land in the artifact (shared parent =
          # workspace): public/ (the catalog site) and roots/ (per-repo
          # root card pages, v8.4). The deploy job downloads both to the
          # workspace root and rsyncs them to different destinations.
          path: |
            public/
            roots/
  deploy:
    needs: build
    runs-on: [self-hosted, linux, ebpro-org, x64]
    steps:
      - name: Download catalog site artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-site
          # Unpack to the workspace root so the artifact's two top-level
          # dirs reappear as ./public/ and ./roots/ (the rsync steps
          # below address them by those paths).
          path: ${{ github.workspace }}
      - name: Ensure rsync is available
        run: |
          set -euo pipefail
          if command -v rsync >/dev/null 2>&1; then
            echo "rsync already present: $(rsync --version | head -n1)"; exit 0
          fi
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -y && $SUDO apt-get install -y rsync
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache rsync
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y rsync
          elif command -v yum >/dev/null 2>&1; then
            $SUDO yum install -y rsync
          else
            echo "::error::rsync missing and no supported package manager (apt-get/apk/dnf/yum) found"
            exit 1
          fi
          echo "Installed: $(rsync --version | head -n1)"
      - name: Deploy to teaching server (rsync subpath)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TEACHING_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::TEACHING_DEPLOY_SSH_KEY secret not set"; exit 1; fi

          # --- write SSH key to temp file ---
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          SSH_OPTS="-i $KEY_FILE -o StrictHostKeyChecking=accept-new"
          REMOTE="bruno@vai.univ-tln.fr"

          # --- rsync catalog into teaching-material/catalog/ (delete scoped to catalog/ only) ---
          mkdir -p public
          rsync -az --delete --mkpath -e "ssh $SSH_OPTS" \
            ./public/ "${REMOTE}:teaching-material/catalog/"

          # --- per-repo root card pages (v8.4): ADDITIVE sync, no --delete.
          #     Each roots/<repo>/index.html lands on teaching-material/<repo>/;
          #     the rendered <branch>/ directories beside it are never touched.
          #     Note-and-accept: deploy-static still rewrites a plain
          #     placeholder over a repo root until the next catalog build
          #     (self-heals via trigger-catalog). ---
          if [ -d ./roots ]; then
            rsync -az --mkpath -e "ssh $SSH_OPTS" \
              ./roots/ "${REMOTE}:teaching-material/"
            echo "✅ root card pages synchronisés ($(find ./roots -name index.html | wc -l | tr -d ' ') fichiers)"
          else
            echo "::notice::./roots absent — root card sync ignoré (artifact public/ uniquement)"
          fi

          # --- drop root redirect index (single file, no --delete at root) ---
          # mktemp creates mode 600 and scp preserves bits: without the
          # chmod the host serves the file with a 403 (Apache denies
          # world-unreadable files). chmod 644 BEFORE scp.
          INDEX_TMP="$(mktemp)"
          cat > "$INDEX_TMP" <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=catalog/"><link rel="canonical" href="catalog/"><title>ebpro</title></head><body><p><a href="catalog/">Catalog ebpro</a></p></body></html>
          EOF
          chmod 644 "$INDEX_TMP"
          scp -i "$KEY_FILE" -o StrictHostKeyChecking=accept-new \
            "$INDEX_TMP" "${REMOTE}:teaching-material/index.html"
          rm -f "$INDEX_TMP"

          echo "✅ catalog déployé vers bruno@vai.univ-tln.fr:teaching-material/catalog/"
