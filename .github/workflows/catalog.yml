name: Teaching catalog
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      preview_branch:
        description: "If set, deploy a PREVIEW for this branch (empty = production, as today)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: catalog-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Generate catalog
        env:
          GITHUB_TOKEN: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python catalog.py
      - name: Upload catalog site artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-site
          path: public/
  deploy:
    needs: build
    runs-on: [self-hosted, linux, ebpro-org, x64]
    steps:
      - name: Download catalog site artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-site
          path: public/
      - name: Deploy to teaching server (rsync subpath)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TEACHING_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::TEACHING_DEPLOY_SSH_KEY secret not set"; exit 1; fi

          # --- write SSH key to temp file ---
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          SSH_OPTS="-i $KEY_FILE -o StrictHostKeyChecking=accept-new"
          REMOTE="bruno@vai.univ-tln.fr"

          # --- rsync catalog into teaching-material/catalog/ (delete scoped to catalog/ only) ---
          mkdir -p public
          rsync -az --delete --mkpath -e "ssh $SSH_OPTS" \
            ./public/ "${REMOTE}:teaching-material/catalog/"

          # --- drop root redirect index (single file, no --delete at root) ---
          INDEX_TMP="$(mktemp)"
          cat > "$INDEX_TMP" <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=catalog/"><title>ebpro</title></head><body><p><a href="catalog/">Catalog ebpro</a></p></body></html>
          EOF
          scp -i "$KEY_FILE" -o StrictHostKeyChecking=accept-new \
            "$INDEX_TMP" "${REMOTE}:teaching-material/index.html"
          rm -f "$INDEX_TMP"

          echo "✅ catalog déployé vers bruno@vai.univ-tln.fr:teaching-material/catalog/"
